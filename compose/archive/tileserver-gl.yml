services:
  engine:
    image: maptiler/tileserver-gl-light:v5.6.0
    command: ["--config", "/config/config.json", "--port", "8080"]
    volumes:
      - ../../configs/archive/tileserver-gl:/config:ro
      - ../../data/cache:/tiles:ro
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 4G

networks:
  default:
    name: m2
    external: true
