services:
  engine:
    image: versatiles/versatiles:v5.9.0
    command: ["serve", "--port", "8080", "[berlin]/tiles/berlin.pmtiles"]
    volumes:
      - ../../data/cache:/tiles:ro
    cpuset: "0-3"
    deploy:
      resources:
        limits:
          memory: 4G

networks:
  default:
    name: m2
    external: true
