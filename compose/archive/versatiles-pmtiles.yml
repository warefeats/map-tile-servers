services:
  engine:
    image: versatiles/versatiles:v5.4.1
    command: ["serve", "--port", "8080", "[berlin]/tiles/berlin.pmtiles"]
    volumes:
      - ../../data/cache:/tiles:ro
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 4G

networks:
  default:
    name: m2
    external: true
