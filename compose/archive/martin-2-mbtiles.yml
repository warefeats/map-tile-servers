services:
  engine:
    image: ${WF_MARTIN_2_IMAGE:?the runner sets it from src/matrix.ts}
    command: ["--config", "/config/config.yaml"]
    volumes:
      - ../../configs/archive/martin-mbtiles:/config:ro
      - ../../data/cache:/tiles:ro
    cpuset: "0-3"
    deploy:
      resources:
        limits:
          memory: 4G

networks:
  default:
    name: m2
    external: true
