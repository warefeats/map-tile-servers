services:
  engine:
    image: protomaps/go-pmtiles:v1.31.2
    command: ["serve", "/tiles", "--port=8080", "--cache-size=64", "--quiet"]
    volumes:
      - ../../data/cache:/tiles:ro
    cpuset: "0-3"
    deploy:
      resources:
        limits:
          memory: 4G

networks:
  default:
    name: m2
    external: true
