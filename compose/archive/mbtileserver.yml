services:
  engine:
    image: wf-mbtileserver:0.11.0
    command: ["--dir", "/tiles", "--port", "8000", "--tiles-only"]
    volumes:
      - ../../data/cache:/tiles:ro
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 4G

networks:
  default:
    name: m2
    external: true
