services:
  engine:
    image: ghcr.io/maplibre/martin:1.16.1
    command: ["--config", "/config/config.yaml"]
    volumes:
      - ../../configs/archive/martin-mbtiles:/config:ro
      - ../../data/cache:/tiles:ro
    cpuset: "0-3"
    deploy:
      resources:
        limits:
          memory: 4G

networks:
  default:
    name: m2
    external: true
