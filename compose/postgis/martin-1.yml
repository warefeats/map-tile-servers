services:
  engine:
    image: ghcr.io/maplibre/martin:1.16.1
    command: ["--config", "/config/config.yaml"]
    environment:
      DATABASE_URL: postgresql://tiles:tiles@db/bench
    volumes:
      - ../../configs/postgis/martin:/config:ro
    cpuset: "0-3"
    deploy:
      resources:
        limits:
          memory: 4G

networks:
  default:
    name: m2
    external: true
