# ldproxy with the opt-in PGIS_TILES extension (ST_AsMVT in PostGIS, ldproxy >= 4.4).
services:
  engine:
    image: iide/ldproxy:4.8.2
    environment:
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=75"
    volumes:
      - ../../configs/postgis/ldproxy/cfg.yml:/ldproxy/data/cfg.yml:ro
      - ../../configs/postgis/ldproxy/entities:/ldproxy/data/entities:ro
      - ../../configs/postgis/ldproxy/providers/bench-pgis.yml:/ldproxy/data/entities/instances/providers/bench.yml:ro
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 4G

networks:
  default:
    name: m2
    external: true
