services:
  engine:
    image: wf-bbox:0.6.2
    command: ["bbox-tile-server", "-c", "/config/bbox.toml", "serve"]
    volumes:
      - ../../configs/postgis/bbox:/config:ro
    cpuset: "0-3"
    deploy:
      resources:
        limits:
          memory: 4G

networks:
  default:
    name: m2
    external: true
