services:
  engine:
    image: ${WF_MARTIN_2_IMAGE:?the runner sets it from src/matrix.ts}
    command: ["--config", "/config/config.yaml"]
    environment:
      DATABASE_URL: postgresql://tiles:tiles@db/bench
    volumes:
      - ../../configs/postgis/martin:/config:ro
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 4G

networks:
  default:
    name: m2
    external: true
