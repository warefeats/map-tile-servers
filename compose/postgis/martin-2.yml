services:
  engine:
    image: wf-martin:2.0.0-055d4ea
    command: ["--config", "/config/config.yaml"]
    environment:
      DATABASE_URL: postgresql://tiles:tiles@db/bench
    volumes:
      - ../../configs/postgis/martin:/config:ro
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 4G

networks:
  default:
    name: m2
    external: true
