services:
  engine:
    image: gospatial/tegola:v0.21.2
    command: ["serve", "--config", "/config/config.toml"]
    environment:
      DATABASE_URL: postgresql://tiles:tiles@db:5432/bench
      GOMAXPROCS: "4"
    volumes:
      - ../../configs/postgis/tegola:/config:ro
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 4G

networks:
  default:
    name: m2
    external: true
