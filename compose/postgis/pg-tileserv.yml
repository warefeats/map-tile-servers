services:
  engine:
    image: pramsey/pg_tileserv:20250131
    command: ["--config", "/config/pg_tileserv.toml"]
    environment:
      DATABASE_URL: postgresql://tiles:tiles@db/bench
      GOMAXPROCS: "4"
    volumes:
      - ../../configs/postgis/pg_tileserv:/config:ro
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 4G

networks:
  default:
    name: m2
    external: true
