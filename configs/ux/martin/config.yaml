# Martin 2.0 for the UX runs: the benchmark's PostGIS config with Martin's default tile cache (256 MB).
listen_addresses: '0.0.0.0:3000'
worker_processes: 4
keep_alive: 75
postgres:
  connection_string: ${DATABASE_URL}
  pool_size: 8
  auto_bounds: skip
  auto_publish:
    from_schemas:
      - bench
    tables:
      source_id_format: '{table}'
      id_columns: fid
      extent: 4096
      buffer: 64
      clip_geom: true
