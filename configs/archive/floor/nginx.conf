# The archive family's floor control (docs/adr/0007): the archive's stored tiles as plain files.
worker_processes 4;
events { worker_connections 4096; }
http {
  access_log off;
  keepalive_requests 100000;
  open_file_cache max=10000 inactive=600s;
  open_file_cache_valid 600s;
  open_file_cache_errors on;
  tcp_nodelay on;
  server {
    listen 8080;
    # /tiles/<tileset>/z/x/y is the file /www/tiles/<tileset>/z/x/y; a tile with no file is empty (204).
    location /tiles/ {
      root /www;
      default_type application/vnd.mapbox-vector-tile;
      add_header Content-Encoding gzip;
      try_files $uri =204;
    }
  }
}
