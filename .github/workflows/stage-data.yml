name: Stage data

# Copies one OpenFreeMap planet build (the archive lane's data, docs/adr/0011) into the rig bucket once, in
# ranged parts that retry on their own (scripts/rig-stage-planet.sh), with each file's sha256 and size recorded
# beside it.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "OpenFreeMap planet build (listed in https://btrfs.openfreemap.com/files.txt)"
        required: true
        default: "20261025_080012_pt"

concurrency:
  group: martin-2-stage-data
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

defaults:
  run:
    shell: bash

jobs:
  planet:
    name: planet ${{ matrix.format }}
    runs-on: ubuntu-24.04
    environment: martin-2-bench
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        format: [mbtiles, pmtiles]
    steps:
      - uses: actions/checkout@v7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1
          role-duration-seconds: 21600

      - name: Copy the planet into the bucket
        env:
          VERSION: ${{ inputs.version }}
          FORMAT: ${{ matrix.format }}
        run: |
          set -euo pipefail
          [[ $VERSION =~ ^[0-9]{8}_[0-9]{6}_[a-z]+$ ]] || { echo "::error::$VERSION is not an OpenFreeMap build id"; exit 1; }
          . scripts/rig-lib.sh
          scripts/rig-stage-planet.sh "$(stack_output RigBucketName)" "$VERSION" "$FORMAT"
